name: Build Portable EXE (.NET 4.8)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Portable EXE
        run: dotnet build WinServiceOptimizer.csproj -c Release -o ./publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinServiceOptimizer-Portable
          path: ./publish/WinServiceOptimizer.exe
